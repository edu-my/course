<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Course — edu-my.web</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/editorial.css?v=3"/>
  <style>
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── HERO — flat red ─────────────────────────────────────────── */
    .ch-hero {
      background: #e03030 !important;
      padding: 48px 32px 40px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 48px;
      align-items: start;
      animation: em-up 0.5s ease both;
    }
    .ch-breadcrumb {
      font-family: 'Inter', sans-serif;
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      color: rgba(255,255,255,.5); margin-bottom: 14px;
    }
    .ch-breadcrumb a { color: rgba(255,255,255,.5); text-decoration: none; }
    .ch-breadcrumb a:hover { color: #fff; }
    .ch-breadcrumb span { margin: 0 6px; }
    .ch-cat {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.7); margin-bottom: 12px; display: block;
    }
    .ch-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 400; line-height: 1.1;
      color: #fff; margin-bottom: 14px;
      animation: em-up 0.5s .1s ease both;
    }
    .ch-desc {
      font-family: 'Inter', sans-serif;
      font-size: 14px; color: rgba(255,255,255,.7);
      line-height: 1.7; max-width: 580px; margin-bottom: 20px;
      animation: em-up 0.5s .15s ease both;
    }
    .ch-stats {
      display: flex; gap: 20px; flex-wrap: wrap;
      animation: em-up 0.5s .2s ease both;
    }
    .ch-stat {
      font-family: 'Inter', sans-serif;
      font-size: 12px; color: rgba(255,255,255,.6);
      display: flex; align-items: center; gap: 5px;
    }
    .ch-stat strong { color: #fff; }

    /* ── ENROLL CARD ─────────────────────────────────────────────── */
    .ch-enroll-card {
      background: #fff;
      border-radius: 10px; overflow: hidden;
      border: 0.5px solid #e0deda;
      position: sticky; top: calc(54px + 16px);
      animation: em-up 0.5s .25s ease both;
    }
    .ch-enroll-thumb {
      height: 160px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; background: #1a1a1a;
    }
    .ch-enroll-body { padding: 20px; }
    .ch-enroll-price {
      font-family: 'DM Serif Display', serif;
      font-size: 36px; font-weight: 400;
      color: #1a1a1a; line-height: 1; margin-bottom: 4px;
    }
    .ch-enroll-price.free { color: #e03030; }
    .ch-enroll-sub {
      font-family: 'Inter', sans-serif;
      font-size: 12px; color: #6b6b6b; margin-bottom: 16px;
    }
    .ch-status {
      padding: 9px 14px; border-radius: 6px;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
      text-align: center; margin-bottom: 10px;
    }
    .ch-status.enrolled { background: #e6f7ee; color: #1e8a4c; }
    .ch-status.pending  { background: #fff3e0; color: #c96a00; }
    .ch-btn {
      display: block; width: 100%;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
      padding: 12px 20px; border-radius: 7px; border: none;
      cursor: pointer; text-align: center; text-decoration: none;
      transition: background .18s; margin-bottom: 8px; box-sizing: border-box;
    }
    .ch-btn.primary   { background: #e03030; color: #fff; }
    .ch-btn.primary:hover { background: #b82424; color: #fff; }
    .ch-btn.secondary { background: #1a1a1a; color: #fff; }
    .ch-btn.secondary:hover { background: #2d2d2d; color: #fff; }
    .ch-btn.success   { background: #1e8a4c; color: #fff; }
    .ch-btn.success:hover { background: #176b3b; color: #fff; }
    .ch-btn.ghost     { background: #f5f4f1; color: #1a1a1a; border: 0.5px solid #e0deda; }
    .ch-perks { margin-top: 16px; display: flex; flex-direction: column; gap: 7px; }
    .ch-perk  { font-family: 'Inter', sans-serif; font-size: 12px; color: #6b6b6b; display: flex; align-items: center; gap: 8px; }

    /* ── COURSE BODY ─────────────────────────────────────────────── */
    .ch-body {
      padding: 40px 32px 80px;
      display: grid; grid-template-columns: 1fr 320px; gap: 48px;
    }
    .ch-section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 24px; font-weight: 400; color: #1a1a1a; margin-bottom: 16px;
    }
    .ch-module {
      border: 0.5px solid #e0deda; border-radius: 8px;
      margin-bottom: 6px; overflow: hidden;
      animation: em-up .4s ease both;
    }
    .ch-module-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; background: #f5f4f1;
      cursor: pointer; user-select: none; transition: background .15s;
    }
    .ch-module-header:hover { background: #e0deda; }
    .ch-module-num {
      width: 26px; height: 26px; background: #e03030; color: #fff;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .ch-module-name {
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
      color: #1a1a1a; flex: 1;
    }
    .ch-module-count { font-family: 'Inter', sans-serif; font-size: 12px; color: #6b6b6b; }
    .ch-module-chevron { font-size: 12px; color: #6b6b6b; transition: transform .2s; }
    .ch-module.open .ch-module-chevron { transform: rotate(180deg); }
    .ch-lessons { display: none; flex-direction: column; }
    .ch-module.open .ch-lessons { display: flex; }
    .ch-lesson {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px 10px 52px;
      border-top: 0.5px solid #e0deda;
      font-family: 'Inter', sans-serif; font-size: 13px; color: #6b6b6b;
    }
    .ch-lesson-name { flex: 1; }
    .ch-lesson-dur  { font-size: 11px; color: #e0deda; }

    /* Loading */
    .ch-loading {
      min-height: 60vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      font-family: 'Inter', sans-serif; font-size: 13px; color: #6b6b6b;
    }

    @media (max-width: 900px) {
      .ch-hero { grid-template-columns: 1fr; gap: 28px; padding: 32px 16px 28px; }
      .ch-body { grid-template-columns: 1fr; padding: 28px 16px 60px; }
      .ch-enroll-card { position: static; }
    }
  </style>
</head>
<body>

<!-- NAVBAR — identical to courses.html and dashboard.html -->
<nav class="navbar">
  <a href="index.html" class="nav-logo">EDU-MY.WEB</a>
  <div class="em-nav-tabs">
    <a href="courses.html" class="em-nav-tab active">Courses</a>
    <a href="dashboard.html" class="em-nav-tab">Dashboard</a>
  </div>
  <div class="nav-actions hidden" id="nav-guest">
    <a href="login.html" class="btn btn-secondary btn-sm">Log In</a>
    <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
  </div>
  <div class="nav-user hidden" id="nav-user">
    <div class="nav-avatar" id="nav-avatar">U</div>
    <div class="nav-user-name" id="nav-name">User</div>
    <div class="nav-dropdown">
      <div class="nav-dropdown-header">
        <div class="nav-dropdown-name" id="dd-name">User</div>
        <div class="nav-dropdown-email" id="dd-email"></div>
      </div>
      <a href="dashboard.html" class="nav-dropdown-item"><span class="item-icon">📊</span> My Dashboard</a>
      <a href="profile.html" class="nav-dropdown-item"><span class="item-icon">👤</span> My Profile</a>
      <button class="nav-dropdown-item danger" id="btn-logout"><span class="item-icon">🚪</span> Log Out</button>
    </div>
  </div>
  <button class="nav-hamburger" id="nav-hamburger"><span></span><span></span><span></span></button>
</nav>

<div class="nav-mobile-drawer" id="nav-mobile-drawer">
  <a href="index.html" class="nav-link">Home</a>
  <a href="courses.html" class="nav-link">Courses</a>
  <a href="dashboard.html" class="nav-link">Dashboard</a>
  <div class="nav-actions hidden" id="nav-mobile-guest">
    <a href="login.html" class="btn btn-secondary">Log In</a>
    <a href="register.html" class="btn btn-primary">Get Started</a>
  </div>
  <div class="hidden" id="nav-mobile-user">
    <a href="dashboard.html" class="nav-link">My Dashboard</a>
    <button class="btn btn-secondary" id="btn-logout-mobile">Log Out</button>
  </div>
</div>

<!-- CONTENT rendered by JS -->
<div id="course-content">
  <div class="ch-loading">
    <div style="width:36px;height:36px;border:3px solid #e0deda;border-top-color:#e03030;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    Loading course...
  </div>
</div>

<!-- WHATSAPP FLOAT -->
<div class="help-float">
  <span class="help-text" id="help-text">Let me know how I can help</span>
  <a class="help-wa" href="https://wa.me/60108402462" target="_blank">
    <svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>
</div>

<script type="module">
  import {initializeApp} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
  import {getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

  const app=initializeApp({apiKey:"AIzaSyCpXYFftiB-agrY44eGKdFyUPm-t7FXbUk",authDomain:"kolamdata.firebaseapp.com",projectId:"kolamdata",storageBucket:"kolamdata.firebasestorage.app",messagingSenderId:"16403132310",appId:"1:16403132310:web:464c4ad2d19812f95077b7"});
  const auth=getAuth(app),db=getFirestore(app);

  const courseId=new URLSearchParams(location.search).get("id");
  if(!courseId){document.getElementById("course-content").innerHTML='<div class="ch-loading">No course specified.</div>';}

  let currentUser=null,courseData=null,enrollDoc=null;

  onAuthStateChanged(auth,async user=>{
    currentUser=user;
    const g=document.getElementById("nav-guest"),u=document.getElementById("nav-user");
    const mg=document.getElementById("nav-mobile-guest"),mu=document.getElementById("nav-mobile-user");
    if(user){
      g?.classList.add("hidden"); u?.classList.remove("hidden");
      mg?.classList.add("hidden"); mu?.classList.remove("hidden");
      const n=user.displayName||"User";
      const el=id=>document.getElementById(id);
      if(el("nav-avatar"))el("nav-avatar").textContent=n.charAt(0).toUpperCase();
      if(el("nav-name"))el("nav-name").textContent=n;
      if(el("dd-name"))el("dd-name").textContent=n;
      if(el("dd-email"))el("dd-email").textContent=user.email||"";
      try{
        const ud=await getDoc(doc(db,"users",user.uid));
        if(ud.exists()&&ud.data().role==="admin"){
          window._coursePageAdmin=true;
          window.cacheAuthUser?.(user,true);
          window.setAdminNav?.(true);
        }else{window.cacheAuthUser?.(user,false);}
      }catch(e){window.cacheAuthUser?.(user,false);}
      if(courseId){
        try{
          const es=await getDoc(doc(db,"enrollments",user.uid+"_"+courseId));
          if(es.exists())enrollDoc=es.data();
        }catch(e){}
      }
    }else{
      g?.classList.remove("hidden"); u?.classList.add("hidden");
      mg?.classList.remove("hidden"); mu?.classList.add("hidden");
    }
    if(courseId)await loadCourse();
  });

  document.getElementById("btn-logout")?.addEventListener("click",()=>signOut(auth).then(()=>{window.clearAuthCache?.();location.href="index.html";}));
  document.getElementById("btn-logout-mobile")?.addEventListener("click",()=>signOut(auth).then(()=>{window.clearAuthCache?.();location.href="index.html";}));

  async function loadCourse(){
    try{
      const snap=await getDoc(doc(db,"courses",courseId));
      if(!snap.exists()){document.getElementById("course-content").innerHTML='<div class="ch-loading">Course not found.</div>';return;}
      courseData={id:snap.id,...snap.data()};
      renderPage();
    }catch(e){
      document.getElementById("course-content").innerHTML='<div class="ch-loading">Failed to load: '+e.message+'</div>';
    }
  }

  function renderPage(){
    const c=courseData,isFree=c.isFree===true,price=isFree?"FREE":"RM "+parseFloat(c.price||0).toFixed(2);
    const mods=c.modules||[];
    const totalLessons=mods.reduce((s,m)=>s+(m.lessons?m.lessons.length:0),0);

    let enrollSection="";
    if(enrollDoc&&(enrollDoc.status==="approved"||(isFree&&enrollDoc.enrollmentId))){
      enrollSection=`<div class="ch-status enrolled">✓ You are enrolled</div><a href="player.html?id=${c.id}" class="ch-btn success">▶ Start Course</a>`;
    }else if(enrollDoc&&enrollDoc.status==="pending"){
      enrollSection='<div class="ch-status pending">⏳ Payment pending approval</div>';
    }else if(window._coursePageAdmin){
      enrollSection=`<a href="player.html?id=${c.id}" class="ch-btn ghost">View Course →</a>`;
    }else if(!currentUser){
      enrollSection=`<a href="login.html" class="ch-btn primary">${isFree?"Start Free — Log in first":"Log in to Enroll"}</a>`;
    }else if(isFree){
      enrollSection='<button class="ch-btn success" id="btn-enroll-free">Start Free Now</button>';
    }else{
      enrollSection=`<button class="ch-btn primary" id="btn-enroll-paid">Enroll — ${price}</button>`;
    }

    const modHtml=mods.length?mods.map((m,i)=>{
      const ll=(m.lessons||[]).map(l=>`<div class="ch-lesson">
        <span>${l.type==="video"?"▶":"📄"}</span>
        <span class="ch-lesson-name">${l.title}</span>
        <span class="ch-lesson-dur">${l.duration||""}</span>
      </div>`).join("");
      return `<div class="ch-module${i===0?" open":""}" onclick="this.classList.toggle('open')">
        <div class="ch-module-header">
          <div class="ch-module-num">${i+1}</div>
          <div class="ch-module-name">${m.title}</div>
          <span class="ch-module-count">${(m.lessons||[]).length} lessons</span>
          <span class="ch-module-chevron">▾</span>
        </div>
        <div class="ch-lessons">${ll}</div>
      </div>`;
    }).join(""):'<p style="font-family:Inter,sans-serif;font-size:13px;color:#6b6b6b;padding:16px;background:#f5f4f1;border-radius:8px;">Course content coming soon.</p>';

    document.getElementById("course-content").innerHTML=`
      <div class="ch-hero">
        <div>
          <div class="ch-breadcrumb">
            <a href="courses.html">Courses</a><span>›</span>${c.category||"General"}<span>›</span>${c.title}
          </div>
          <span class="ch-cat">✦ ${c.category||"General"}</span>
          <div class="ch-title">${c.title}</div>
          <div class="ch-desc">${c.description||""}</div>
          <div class="ch-stats">
            ${c.totalDuration?`<div class="ch-stat">⏱ <strong>${c.totalDuration}</strong></div>`:""}
            ${mods.length?`<div class="ch-stat">📦 <strong>${mods.length} modules</strong></div>`:""}
            ${totalLessons?`<div class="ch-stat">📖 <strong>${totalLessons} lessons</strong></div>`:""}
            <div class="ch-stat">🏅 <strong>Certificate included</strong></div>
          </div>
        </div>
        <div class="ch-enroll-card">
          <div class="ch-enroll-thumb">${c.thumbnailEmoji||"📚"}</div>
          <div class="ch-enroll-body">
            <div class="ch-enroll-price${isFree?" free":""}">${price}</div>
            <div class="ch-enroll-sub">${isFree?"No payment required":"One-time payment"}</div>
            ${enrollSection}
            <div class="ch-perks">
              <div class="ch-perk">📱 Access on any device</div>
              <div class="ch-perk">🏅 Certificate on completion</div>
              <div class="ch-perk">♾ Lifetime access</div>
            </div>
          </div>
        </div>
      </div>
      <div class="ch-body">
        <div>
          <div class="ch-section-title">Course Curriculum</div>
          ${modHtml}
        </div>
        <div></div>
      </div>`;

    document.getElementById("btn-enroll-free")?.addEventListener("click",enrollFree);
    document.getElementById("btn-enroll-paid")?.addEventListener("click",()=>{
      if(!currentUser){location.href="login.html";return;}
      location.href="payment.html?course="+courseId;
    });
  }

  async function enrollFree(){
    if(!currentUser){location.href="login.html";return;}
    const btn=document.getElementById("btn-enroll-free");
    btn.disabled=true;btn.textContent="Enrolling...";
    try{
      const enrollId=currentUser.uid+"_"+courseId;
      await setDoc(doc(db,"enrollments",enrollId),{
        enrollmentId:enrollId,userId:currentUser.uid,courseId,
        courseName:courseData.title,enrolledAt:serverTimestamp(),
        completedLessons:[],progressPercent:0,isCompleted:false,
        completedAt:null,lastLessonId:null,certificateIssued:false
      });
      location.href="player.html?id="+courseId;
    }catch(e){
      btn.disabled=false;btn.textContent="Start Free Now";
      alert("Enrollment failed: "+e.message);
    }
  }
</script>
<script>setTimeout(()=>{const t=document.getElementById("help-text");if(t)t.classList.add("visible");},4000);</script>
<script src="js/nav.js"></script>
</body>
</html>
