<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>edu-my.web — Learn Smarter. Teach Better.</title>

  <!-- PRECONNECT — fonts load in parallel, not blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=optional" rel="stylesheet"/>

  <!-- DESIGN SYSTEM -->
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/pages.css"/>

  <style>
    /* ── ANTI-FLICKER CRITICAL CSS ─────────────────────────────────
       Body starts invisible. App reveals it after auth + first render.
       This is the banking-smooth trick. Nothing ever flashes.        */
    body {
      opacity: 0;
      background: #fff;
    }
    body.app-ready {
      opacity: 1;
      transition: opacity 0.18s ease;
    }

    /* ── PAGE TRANSITION ────────────────────────────────────────── */
    #page-root {
      animation: pageIn 0.22s ease both;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ── NAVBAR — renders once, never reloads ─────────────────── -->
  <nav class="navbar" id="navbar">
    <a href="#/" class="nav-logo">edu-my.web</a>
    <div class="nav-links">
      <a href="#/"          class="nav-link" data-route="/">Home</a>
      <a href="#/courses"   class="nav-link" data-route="/courses">Courses</a>
      <a href="#/dashboard" class="nav-link" data-route="/dashboard">Dashboard</a>
    </div>

    <!-- Guest nav — shown when logged out -->
    <div class="nav-actions" id="nav-guest">
      <a href="#/login"    class="btn btn-secondary btn-sm">Log In</a>
      <a href="#/register" class="btn btn-primary btn-sm">Get Started</a>
    </div>

    <!-- User nav — shown when logged in -->
    <div class="nav-user hidden" id="nav-user">
      <div class="nav-avatar" id="nav-avatar">U</div>
      <div class="nav-user-name" id="nav-name">User</div>
      <div class="nav-dropdown">
        <div class="nav-dropdown-header">
          <div class="nav-dropdown-name" id="dd-name">User</div>
          <div class="nav-dropdown-email" id="dd-email"></div>
        </div>
        <a href="#/dashboard"   class="nav-dropdown-item"><span class="item-icon">📊</span> My Dashboard</a>
        <a href="#/profile"     class="nav-dropdown-item"><span class="item-icon">👤</span> My Profile</a>
        <a href="#/certificates" class="nav-dropdown-item"><span class="item-icon">🏆</span> Certificates</a>
        <button class="nav-dropdown-item danger" id="btn-logout"><span class="item-icon">🚪</span> Log Out</button>
      </div>
    </div>

    <button class="nav-hamburger" id="nav-hamburger">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Mobile drawer -->
  <div class="nav-mobile-drawer" id="nav-mobile-drawer">
    <a href="#/"          class="nav-link">Home</a>
    <a href="#/courses"   class="nav-link">Courses</a>
    <a href="#/dashboard" class="nav-link">Dashboard</a>
    <div class="nav-actions" id="nav-mobile-guest">
      <a href="#/login"    class="btn btn-secondary">Log In</a>
      <a href="#/register" class="btn btn-primary">Get Started</a>
    </div>
    <div class="hidden" id="nav-mobile-user">
      <a href="#/dashboard" class="nav-link">My Dashboard</a>
      <button class="btn btn-secondary" id="btn-logout-mobile">Log Out</button>
    </div>
  </div>

  <!-- ── PAGE OUTLET — all page content renders here ──────────── -->
  <main id="page-root"></main>

  <!-- ── WHATSAPP FLOAT — persists across all pages ───────────── -->
  <div class="help-float">
    <span class="help-text" id="help-text">Let me know how I can help</span>
    <a class="help-wa" href="https://wa.me/60108402462" target="_blank">
      <svg viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </a>
  </div>

  <!-- ── APP BOOTSTRAP ─────────────────────────────────────────── -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
